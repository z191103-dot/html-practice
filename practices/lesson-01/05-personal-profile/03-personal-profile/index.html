<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice 16</title>
</head>
<body>
    <header>
        <h1>Alex Rivera</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="about">
        <p>I am learning to build web pages with HTML.</p>
        <img src="images/photo.jpg" alt="Alex Rivera">

        <ul>
            <li>HTML</li>
            <li>Accessibility</li>
            <li>Tables</li>
        </ul>
    </main>

    <section id="contact">
        <h2>Contact</h2>
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Alex Rivera</p>
        <a href="https://github.com/alexrivera">GitHub</a>
    </footer>
</body>
</html>
